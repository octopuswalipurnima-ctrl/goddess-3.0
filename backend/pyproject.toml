[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goddess-ai-backend"
version = "2.0.0"
description = "Goddess AI 2.0 - Asynchronous Backend Core for Multi-Stream Live Moderation & AI Co-Host"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Goddess AI Team" }]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
